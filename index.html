<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 시험 출제 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1714;
    --paper: #f5f0e8;
    --paper2: #ede8dc;
    --accent: #8b2e2e;
    --line: #ccc4b0;
    --muted: #7a7060;
    --success: #2e6b3e;
    --card: #faf7f2;
    --shadow: 0 2px 12px rgba(26,23,20,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 28px 48px 24px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    border-bottom: 4px solid var(--accent);
  }
  .header-logo {
    font-size: 28px;          /* ⑪ 키움 */
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .header-sub {
    font-size: 13px;
    color: #aaa49a;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .header-rule { width: 1px; height: 34px; background: #444; flex-shrink: 0; }
  .header-desc { font-size: 14px; color: #aaa49a; font-weight: 300; line-height: 1.6; }

  /* ── MAIN ── */
  main { max-width: 900px; margin: 48px auto; padding: 0 24px 80px; }

  /* ── STEP CARD ── */
  .step-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 36px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .step-label {
    position: absolute;
    top: -12px; left: 24px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 3px 12px;
    border-radius: 2px;
  }
  .step-title {
    font-size: 18px;          /* ⑤ 크게 */
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--ink);
  }

  /* ── FORM ── */
  label.field-label {
    display: block;
    font-size: 13px;          /* ⑤ 크게 */
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 7px;
    text-transform: uppercase;
  }
  select, input[type="text"], input[type="number"] {
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;          /* ⑤ 크게 */
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(139,46,46,0.10);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  /* ── 과 정보 요약 ── */
  #dayInfoWrap {
    display: none;
    margin-top: 18px;
    background: var(--paper2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 18px;
    font-size: 15px;          /* ⑤ 크게 */
    color: var(--ink);
    line-height: 1.8;
  }
  #dayInfoWrap strong { color: var(--accent); }

  /* ── 범위 힌트 ── */
  .range-hint {
    margin-top: 10px;
    font-size: 14px;          /* ⑨ 크게 */
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    line-height: 1.8;
  }
  .range-hint b { color: var(--ink); font-size: 15px; }
  .total-words-msg {
    margin-top: 8px;
    font-size: 14px;
    color: var(--success);
    font-weight: 700;
    display: none;
  }
  .error-msg {
    color: #c0392b;
    font-size: 14px;
    margin-top: 6px;
    display: none;
  }

  /* ── PDF 옵션 ── */
  .pdf-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .pdf-btn-select {
    padding: 10px 22px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    font-size: 14px;          /* ⑤ */
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    color: var(--ink);
    font-weight: 500;
  }
  .pdf-btn-select:hover, .pdf-btn-select.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* ── 체크박스 ── */
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 15px;          /* ⑤ */
  }
  .checkbox-item input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ── 구분선 ── */
  .divider { height: 1px; background: var(--line); margin: 20px 0; }

  /* ── 액션 버튼 ── */
  .action-row { display: flex; gap: 12px; margin-top: 32px; }
  .btn {
    padding: 15px 32px;
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.18s;
  }
  .btn-primary { background: var(--accent); color: #fff; flex: 1; }
  .btn-primary:hover { background: #6e2222; }
  .btn-primary:disabled { background: #bbb; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-outline:hover { background: var(--paper2); }

  /* ── 로딩 ── */
  #loadingOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(245,240,232,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #loadingOverlay.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 24px;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 600px) {
    header { padding: 20px; }
    main { padding: 0 12px 60px; }
    .step-card { padding: 24px 16px; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-sub">PREMIUM VOCA</div>      <!-- ⑪ -->
    <div class="header-logo">Premium Voca</div>
  </div>
  <div class="header-rule"></div>
  <div class="header-desc">단어장을 선택하고<br>출제 범위를 설정하세요</div>
</header>

<main>

  <!-- STEP 1 -->
  <div class="step-card">
    <div class="step-label">STEP 1</div>
    <div class="step-title">단어장 선택</div>
    <label class="field-label">단어장</label>
    <select id="vocaSelect">
      <option value="">— 단어장을 선택하세요 —</option>
    </select>
    <div id="dayInfoWrap"></div>
  </div>

  <!-- STEP 2 -->
  <div class="step-card">
    <div class="step-label">STEP 2</div>
    <div class="step-title">학생 / 학원 정보 <span style="font-size:13px;font-weight:400;color:var(--muted);">(선택)</span></div>
    <div class="form-row">
      <div>
        <label class="field-label">학생 이름</label>
        <input type="text" id="studentName" placeholder="이름 입력 (선택)">
      </div>
      <div>
        <label class="field-label">학원 이름</label>   <!-- ⑧ -->
        <input type="text" id="academyName" placeholder="학원명 입력 (선택)">
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step-card">
    <div class="step-label">STEP 3</div>
    <div class="step-title">출제 설정</div>
    <div class="form-row">
      <div>
        <label class="field-label">출제 범위</label>
        <input type="text" id="rangeInput" placeholder="예: 1-5 / 1,3,7 / 1-5,7,9">
        <div class="range-hint">
          연속: <b>1-5</b> &nbsp;|&nbsp; 선택: <b>1,3,7</b> &nbsp;|&nbsp; 혼합: <b>1-5,7,9</b>
        </div>
        <div class="error-msg" id="rangeError"></div>
        <div class="total-words-msg" id="totalWordsMsg"></div>
      </div>
      <div>
        <label class="field-label">출제 개수</label>
        <input type="number" id="countInput" placeholder="숫자 입력" min="1">
        <div class="error-msg" id="countError"></div>
      </div>
    </div>
  </div>

  <!-- STEP 4 -->
  <div class="step-card">
    <div class="step-label">STEP 4</div>
    <div class="step-title">출력 / 저장 옵션</div>
    <label class="checkbox-item" style="margin-bottom:12px;">
      <input type="checkbox" id="chkAnswerPrint"> 인쇄 시 답지 포함
    </label>

    <div class="divider"></div>

    <label class="field-label">PDF 저장 옵션</label>
    <div class="pdf-row">
      <button class="pdf-btn-select active" id="pdfOpt3" onclick="selectPdfOpt(3)">문제지 + 답지</button>  <!-- ⑩ 기본값 변경 -->
      <button class="pdf-btn-select" id="pdfOpt1" onclick="selectPdfOpt(1)">문제지만</button>
      <button class="pdf-btn-select" id="pdfOpt2" onclick="selectPdfOpt(2)">답지만</button>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-outline" onclick="resetAll()">초기화</button>
    <button class="btn btn-primary" id="btnGenerate" onclick="generateExam()" disabled>시험지 생성</button>
  </div>

</main>

<footer>Premium Voca Exam System &nbsp;·&nbsp; Denzel0304</footer>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:15px;color:var(--muted);">단어장 불러오는 중...</div>
</div>

<script>
let vocaDB = null;
let vocaIndex = [];
let pdfOption = 3;  // ⑩ 기본값 3 (문제지+답지)

window.addEventListener('DOMContentLoaded', async () => {
  await loadIndex();
  document.getElementById('rangeInput').addEventListener('input', onRangeChange);
  document.getElementById('countInput').addEventListener('input', validateCount);
  document.getElementById('vocaSelect').addEventListener('change', onVocaChange);
});

async function loadIndex() {
  try {
    const res = await fetch('data/index.json?v=' + Date.now());
    vocaIndex = await res.json();
    const sel = document.getElementById('vocaSelect');
    vocaIndex.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.title;
      sel.appendChild(opt);
    });
  } catch(e) {
    alert('단어장 목록을 불러오지 못했습니다.');
  }
}

async function onVocaChange() {
  const id = document.getElementById('vocaSelect').value;
  if (!id) { vocaDB = null; hideDayInfo(); updateBtn(); return; }
  showLoading();
  try {
    const entry = vocaIndex.find(v => v.id === id);
    const res = await fetch(entry.file + '?v=' + Date.now());
    vocaDB = await res.json();
    showDayInfo();
  } catch(e) {
    alert('단어장을 불러오지 못했습니다.');
  }
  hideLoading();
  updateBtn();
}

// ④ 과 정보 요약 표시
function showDayInfo() {
  const wrap = document.getElementById('dayInfoWrap');
  wrap.style.display = 'block';

  const days = vocaDB.days;
  const total = days.length;

  // 과별 단어 수 그룹핑
  const groups = [];
  let groupStart = days[0].day;
  let groupCount = days[0].words.length;
  let prevCount = days[0].words.length;

  for (let i = 1; i < days.length; i++) {
    const cnt = days[i].words.length;
    if (cnt !== prevCount) {
      groups.push({ start: groupStart, end: days[i-1].day, count: prevCount });
      groupStart = days[i].day;
      prevCount = cnt;
    }
    groupCount = cnt;
  }
  groups.push({ start: groupStart, end: days[days.length-1].day, count: prevCount });

  let html = `<strong>총 ${total}과</strong> &nbsp;·&nbsp; `;

  if (groups.length === 1) {
    // 모든 과 단어 수 동일
    html += `각 과당 <strong>${groups[0].count}개</strong>`;
  } else {
    // 그룹별 표시
    html += groups.map(g => {
      const range = g.start === g.end ? `${g.start}과` : `${g.start}–${g.end}과`;
      return `${range} <strong>${g.count}개</strong>`;
    }).join(' &nbsp;/&nbsp; ');
  }

  wrap.innerHTML = html;
}

function hideDayInfo() {
  const wrap = document.getElementById('dayInfoWrap');
  wrap.style.display = 'none';
}

function parseRange(str) {
  if (!str.trim()) return null;
  const parts = str.split(',').map(s => s.trim()).filter(Boolean);
  const days = new Set();
  for (const part of parts) {
    if (part.includes('-')) {
      const [a, b] = part.split('-').map(Number);
      if (isNaN(a) || isNaN(b) || a > b) return null;
      for (let i = a; i <= b; i++) days.add(i);
    } else {
      const n = Number(part);
      if (isNaN(n) || n <= 0) return null;
      days.add(n);
    }
  }
  return [...days].sort((a, b) => a - b);
}

function getWordsFromDays(dayNums) {
  if (!vocaDB) return [];
  const words = [];
  dayNums.forEach(n => {
    const day = vocaDB.days.find(d => d.day === n);
    if (day) day.words.forEach(w => words.push({ ...w, day: n }));
  });
  return words;
}

function onRangeChange() {
  const val = document.getElementById('rangeInput').value;
  const errEl = document.getElementById('rangeError');
  const msgEl = document.getElementById('totalWordsMsg');
  errEl.style.display = 'none';
  msgEl.style.display = 'none';
  if (!vocaDB || !val.trim()) { updateBtn(); return; }

  const days = parseRange(val);
  if (!days) {
    errEl.textContent = '범위 형식이 올바르지 않습니다.';
    errEl.style.display = 'block';
    updateBtn(); return;
  }
  const invalid = days.filter(n => !vocaDB.days.find(d => d.day === n));
  if (invalid.length) {
    errEl.textContent = `존재하지 않는 과입니다: Day ${invalid.join(', ')}`;
    errEl.style.display = 'block';
    updateBtn(); return;
  }
  const words = getWordsFromDays(days);
  msgEl.textContent = `선택 범위: Day ${days.join(', ')} — 총 ${words.length}개`;
  msgEl.style.display = 'block';
  document.getElementById('countInput').max = words.length;
  validateCount();
  updateBtn();
}

function validateCount() {
  const val = document.getElementById('rangeInput').value;
  const count = parseInt(document.getElementById('countInput').value);
  const errEl = document.getElementById('countError');
  errEl.style.display = 'none';
  if (!vocaDB || !val.trim()) { updateBtn(); return; }
  const days = parseRange(val);
  if (!days) { updateBtn(); return; }
  const total = getWordsFromDays(days).length;
  if (count > total) {
    errEl.textContent = `최대 ${total}개까지 출제 가능합니다.`;
    errEl.style.display = 'block';
  }
  updateBtn();
}

function updateBtn() {
  const btn = document.getElementById('btnGenerate');
  const rangeVal = document.getElementById('rangeInput').value.trim();
  const countVal = parseInt(document.getElementById('countInput').value);
  const hasRangeError = document.getElementById('rangeError').style.display === 'block';
  const hasCountError = document.getElementById('countError').style.display === 'block';
  const days = rangeVal ? parseRange(rangeVal) : null;
  const total = (vocaDB && days) ? getWordsFromDays(days).length : 0;
  btn.disabled = !(vocaDB && days && countVal >= 1 && countVal <= total && !hasRangeError && !hasCountError);
}

function selectPdfOpt(n) {
  pdfOption = n;
  [1, 2, 3].forEach(i => {
    document.getElementById(`pdfOpt${i}`).classList.toggle('active', i === n);
  });
}

function resetAll() {
  document.getElementById('vocaSelect').value = '';
  vocaDB = null;
  hideDayInfo();
  document.getElementById('studentName').value = '';
  document.getElementById('academyName').value = '';
  document.getElementById('rangeInput').value = '';
  document.getElementById('countInput').value = '';
  document.getElementById('rangeError').style.display = 'none';
  document.getElementById('countError').style.display = 'none';
  document.getElementById('totalWordsMsg').style.display = 'none';
  document.getElementById('chkAnswerPrint').checked = false;
  selectPdfOpt(3);
  updateBtn();
}

function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateExam() {
  const rangeVal = document.getElementById('rangeInput').value.trim();
  const count = parseInt(document.getElementById('countInput').value);
  const days = parseRange(rangeVal);
  const pool = getWordsFromDays(days);
  const selected = shuffle(pool).slice(0, count);

  const questions = selected.map(w => ({
    ...w,
    direction: Math.random() < 0.5 ? 'enKo' : 'koEn'
  }));

  const payload = {
    vocaTitle: vocaDB.title,
    studentName: document.getElementById('studentName').value.trim(),
    academyName: document.getElementById('academyName').value.trim(),  // ⑧
    rangeStr: rangeVal,
    questions,
    printAnswer: document.getElementById('chkAnswerPrint').checked,
    pdfOption,
  };

  sessionStorage.setItem('examPayload', JSON.stringify(payload));
  window.location.href = 'exam.html';
}
</script>
</body>
</html>
