<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 시험지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #1a1714;
  --paper: #f5f0e8;
  --accent: #8b2e2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--paper); color: var(--ink); }

/* ── 툴바 ── */
#toolbar {
  background: var(--ink); color: #fff;
  padding: 14px 32px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-bottom: 3px solid var(--accent);
  position: sticky; top: 0; z-index: 100;
}
.toolbar-title { font-size: 15px; font-weight: 700; margin-right: 4px; }
.tbtn {
  padding: 8px 14px; border: 1px solid #555; background: transparent; color: #fff;
  font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500;
  border-radius: 3px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.tbtn:hover { background: #333; }
.tbtn-primary { background: var(--accent); border-color: var(--accent); }
.tbtn-primary:hover { background: #6e2222; }
.tbtn-back { border-color: #888; color: #ccc; }
.sep { width: 1px; height: 24px; background: #444; flex-shrink: 0; }
.tb-spacer { flex: 1; }

/* [9] 우측 정보: 범위·문항만 표시 */
#tbInfo { font-size: 12px; color: #aaa; }

/* ── 프리뷰 영역 ── */
#preview {
  padding: 32px 24px 60px;
  display: flex; flex-direction: column; align-items: center; gap: 40px;
}

/* ── 시험지 래퍼 (화면) ── */
.sheet-wrapper {
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.13);
  border-radius: 2px;
  position: relative;
  width: min(794px, 100%);
}



/* =============================================
   시험지 내부 — 화면 + 인쇄 공용
   ============================================= */
.exam-page {
  width: 794px;
  height: 1123px;
  padding: 36px 44px 32px 44px;
  font-family: 'Noto Sans KR', sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── 헤더 ── */
.exam-header {
  display: flex;
  align-items: stretch;
  border: 2.5px solid #111;
  margin-bottom: 5px;
  flex-shrink: 0;
  height: 58px;
}
.exam-header-left {
  flex: 1;
  padding: 0 14px;
  font-size: 21px;
  font-weight: 700;
  border-right: 1.5px solid #111;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.exam-header-center {
  width: 180px;
  padding: 0 10px;
  font-size: 13px;
  border-right: 1.5px solid #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.exam-header-center .hlabel { font-size: 9px; font-weight: 700; color: #888; letter-spacing: 0.06em; }
.exam-header-center .hval { font-size: 13px; font-weight: 500; }
.exam-header-right {
  width: 190px;
  display: flex;
  flex-direction: column;
  font-size: 12px;
}
.exam-header-right .hrow {
  padding: 0 10px;
  display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid #ccc;
  flex: 1;
}
.exam-header-right .hrow:last-child { border-bottom: none; }
.exam-header-right .hkey { font-weight: 700; color: #555; min-width: 36px; font-size: 10px; }

/* ── 2열 표 ── */
.exam-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 6px;
  flex: 1;
  min-height: 0;
}

/* ── 단어 표 ── */
.exam-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border: 2px solid #111;
  height: 100%;
}
.exam-table th, .exam-table td {
  border: 0.6px solid #999;
  font-size: 13px;
  padding: 0 6px;
  line-height: 1.1;
  overflow: hidden;                /* ★ 수정: 행 팽창 방지 */
}
.exam-table th {
  background: #edeae2;
  text-align: center;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 3px 4px;
  border-bottom: 1.5px solid #888;
  height: 20px;
}

/* No. 컬럼 2배 너비 / 단어 컬럼 유지 / 줄어드는 부분은 답란 */
.col-num  { width: 44px; }
.col-word { width: 42%; }
.col-ans  { }

/* 번호 폰트 */
.td-num {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: #111;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
}
.td-word {
  font-size: 13px;
  word-break: normal;
  overflow-wrap: anywhere;         /* ★ 수정: break-word → anywhere */
  line-height: 1.2;
}
.td-ans  { font-size: 13px; color: #111; }
.td-ans.blank { color: transparent; }

/* [2] 답지에서 빈 슬롯(null) 행 — 테두리만, 내용 없음 */
.td-ans.blank-ans { color: transparent; }

/* tbody 행 균등 분배 + 최대 높이 cap */
.exam-table tbody tr {
  height: calc((100% - 20px) / 25);
  max-height: calc((100% - 20px) / 25 * 1.6); /* ★ 수정: 줄바꿈 시 과도한 팽창 방지 */
}

/* =============================================
   인쇄 전용
   ============================================= */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; }
  #toolbar { display: none !important; }
  #preview { padding: 0 !important; gap: 0 !important; }

  /* [1] 빈 페이지 버그 핵심 수정:
     no-print 요소는 display:none으로 DOM에서 완전히 제거,
     page-break-after는 실제 출력 대상 요소에만 적용,
     마지막 출력 요소에는 page-break-after:auto */
  .no-print { display: none !important; }

  .sheet-wrapper {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 210mm !important;
    /* page-break는 JS로 동적 처리 — 여기선 제거 */
  }

  /* [4] 인쇄 시에도 sheet-label 표시 */
  .sheet-label {
    display: block !important;
    position: absolute; top: 6px; right: 10px;
    font-size: 10px; background: var(--accent) !important; color: #fff !important;
    padding: 2px 8px; border-radius: 2px; font-weight: 700; letter-spacing: 0.1em;
    z-index: 10;
  }

  .exam-page {
    width: 210mm !important;
    height: 297mm !important;
    padding: 10mm 12mm 9mm 12mm !important;
    overflow: hidden;
    page-break-after: always;
    page-break-inside: avoid;
    break-after: page;
    break-inside: avoid;
  }

  /* 마지막으로 출력되는 exam-page에는 break 없음 — JS로 클래스 부여 */
  .exam-page.last-print-page {
    page-break-after: auto !important;
    break-after: auto !important;
  }

  .exam-table { height: 100%; page-break-inside: avoid; break-inside: avoid; }

  @page { size: A4 portrait; margin: 0; }
}

/* ── Wide 레이아웃 (속담·영작 전용) ── */
.exam-header-wide { height: 44px; }
.exam-page-wide .exam-header-left { font-size: 17px; }
.exam-body-wide { flex: 1; min-height: 0; }
.exam-table-wide {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border: 2px solid #111;
  height: 100%;
}
.exam-table-wide th, .exam-table-wide td {
  border: 0.6px solid #999;
  font-size: 10.5px;
  padding: 0 8px;
  overflow: hidden;
}
.exam-table-wide th {
  background: #edeae2;
  text-align: center;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 3px 4px;
  border-bottom: 1.5px solid #888;
  height: 20px;
  white-space: nowrap;
}
/* 번호행 (홀수행): 음영 처리 */
.exam-table-wide tbody tr.row-q {
  background: #edeae2;
  height: calc((100% - 20px) / 24);
}
/* 답 기입행 (짝수행): 흰색 */
.exam-table-wide tbody tr.row-a {
  background: #fff;
  height: calc((100% - 20px) / 24);
}
.col-num-wide  { width: 44px; }
.col-cont-wide { /* 나머지 전체 */ }
.exam-table-wide .td-num-wide {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #111;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  vertical-align: middle;
}
.exam-table-wide .td-q {
  font-size: 10.5px;
  overflow-wrap: anywhere;
  line-height: 1.2;
  vertical-align: middle;
}
.exam-table-wide .td-ans-wide {
  font-size: 10.5px;
  color: #111;
  vertical-align: middle;
}
.exam-table-wide .td-ans-wide.blank { color: transparent; }
.exam-table-wide .td-ans-wide.blank-ans { color: transparent; }
/* 답 기입행의 번호 셀: 빈 셀이지만 테두리 유지 */
.exam-table-wide .td-empty-num {
  border-right: 0.6px solid #999;
}

@media print {
  .exam-table-wide { height: 100%; page-break-inside: avoid; break-inside: avoid; }
  .exam-table-wide tbody tr.row-q { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.pdf-dropdown {
  position: relative;
  display: inline-block;
}
.pdf-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: #222;
  border: 1px solid #444;
  border-radius: 3px;
  min-width: 160px;
  z-index: 200;
  overflow: hidden;
}
.pdf-dropdown-menu.open { display: block; }
.pdf-dropdown-menu button {
  display: block;
  width: 100%;
  padding: 10px 16px;
  background: transparent;
  color: #fff;
  border: none;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #333;
}
.pdf-dropdown-menu button:last-child { border-bottom: none; }
.pdf-dropdown-menu button:hover { background: #333; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="tbtn tbtn-back" onclick="history.back()">← 돌아가기</button>
  <div class="sep"></div>
  <span class="toolbar-title" id="tbTitle"></span>
  <div class="sep"></div>

  <!-- [8] 인쇄 버튼 3개 -->
  <button class="tbtn tbtn-primary" onclick="doPrint('all')">🖨 모두 인쇄</button>
  <button class="tbtn" onclick="doPrint('question')">문제지 인쇄</button>
  <button class="tbtn" onclick="doPrint('answer')">답지 인쇄</button>

  <div class="sep"></div>

  <!-- [6][8] PDF 저장 버튼 3개 -->
  <button class="tbtn" onclick="savePdf('all')">💾 모두 저장</button>
  <button class="tbtn" onclick="savePdf('question')">문제지 저장</button>
  <button class="tbtn" onclick="savePdf('answer')">답지 저장</button>

  <div class="tb-spacer"></div>
  <!-- [9] 범위·문항 수만 표시 (출력옵션 제외) -->
  <span id="tbInfo"></span>
</div>

<div id="preview"></div>

<!-- 커스텀 PDF 저장 안내 모달 -->
<div id="pdfGuideModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:6px;padding:36px 40px;max-width:400px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.25);font-family:'Noto Sans KR',sans-serif;">
    <div style="font-size:22px;margin-bottom:6px;">📄</div>
    <div style="font-size:17px;font-weight:700;color:#1a1714;margin-bottom:16px;">PDF 저장 안내</div>
    <div style="font-size:14px;color:#555;line-height:1.9;margin-bottom:24px;">
      저장 대상: <strong id="pdfGuideTarget" style="color:#8b2e2e;"></strong><br>
      확인을 누르면 인쇄 창이 열립니다.<br>
      프린터 목록에서<br>
      <strong>"Microsoft Print to PDF"</strong> 또는<br>
      <strong>"PDF로 저장"</strong>을 선택하시면<br>
      PDF 파일로 저장됩니다.
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closePdfGuide(false)" style="padding:10px 22px;border:1px solid #ccc;background:#fff;border-radius:3px;font-size:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">취소</button>
      <button id="pdfGuideMode" onclick="closePdfGuide(true)" style="padding:10px 22px;border:none;background:#8b2e2e;color:#fff;border-radius:3px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">확인</button>
    </div>
  </div>
</div>

<script>
const raw = sessionStorage.getItem('examPayload');
if (!raw) { alert('출제 데이터가 없습니다.'); location.href = 'index.html'; }
const P = JSON.parse(raw);
const { vocaTitle, vocaId, studentName, academyName, rangeStr, questions, enKoCount, koEnCount } = P;

// ── Wide 레이아웃 여부 (속담·영작 단어장)
function isWide() { return vocaId === 'voca11' || vocaId === 'voca12'; }

document.getElementById('tbTitle').textContent = vocaTitle;
// [9] 범위와 문항 수만 표시
document.getElementById('tbInfo').textContent =
  `Day ${rangeStr} · ${questions.length}문항 (영한 ${enKoCount ?? '?'} / 한영 ${koEnCount ?? '?'})`;

// ── [10] 빈 페이지 버그 수정: 실제 문항 수에 맞게 페이지 분할 ──
function splitPages(qs) {
  const pages = [];
  const perPage = isWide() ? 12 : 50; // Wide: 12문제/페이지, 일반: 50문제/페이지
  for (let i = 0; i < qs.length; i += perPage) {
    const chunk = qs.slice(i, i + perPage);
    while (chunk.length < perPage) chunk.push(null);
    pages.push(chunk);
  }
  return pages;
}

const pages = splitPages(questions);

function questionText(q) {
  if (!q) return '';
  return q.direction === 'enKo' ? q.en : q.ko;
}
function answerText(q) {
  if (!q) return '';
  return q.direction === 'enKo' ? q.ko : q.en;
}

function makeTableHTML(half, startNum, isAnswer) {
  let rows = '';
  half.forEach((q, i) => {
    const num = startNum + i;
    const qText = q ? questionText(q) : '';
    const aText = q ? answerText(q) : '';
    let ansTd;
    if (!q) {
      // [2] null 슬롯: 문제지·답지 모두 내용 없는 빈 칸 (테두리만)
      ansTd = `<td class="td-ans blank-ans">&nbsp;</td>`;
    } else if (isAnswer) {
      ansTd = `<td class="td-ans">${aText}</td>`;
    } else {
      ansTd = `<td class="td-ans blank">&nbsp;</td>`;
    }
    rows += `<tr>
      <td class="td-num">${q ? num : ''}</td>
      <td class="td-word">${qText}</td>
      ${ansTd}
    </tr>`;
  });
  return `
    <table class="exam-table">
      <colgroup><col class="col-num"><col class="col-word"><col class="col-ans"></colgroup>
      <thead><tr>
        <th class="col-num">No.</th>
        <th class="col-word">단어</th>
        <th class="col-ans">답</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Wide 전용: 24행(2행×12문제) 테이블 ──
function makeTableHTMLWide(slots, startNum, isAnswer) {
  let rows = '';
  slots.forEach((q, i) => {
    const num   = startNum + i;
    const qText = q ? questionText(q) : '';
    const aText = q ? answerText(q) : '';
    // 번호행 (음영): 번호 + 질문 문장
    rows += `<tr class="row-q">
      <td class="td-num-wide">${q ? num : ''}</td>
      <td class="td-q">${qText}</td>
    </tr>`;
    // 답 기입행 (흰색): 빈 번호 셀 + 답 기입란
    let ansCell;
    if (!q) {
      ansCell = `<td class="td-ans-wide blank-ans">&nbsp;</td>`;
    } else if (isAnswer) {
      ansCell = `<td class="td-ans-wide">${aText}</td>`;
    } else {
      ansCell = `<td class="td-ans-wide blank">&nbsp;</td>`;
    }
    rows += `<tr class="row-a">
      <td class="td-empty-num"></td>
      ${ansCell}
    </tr>`;
  });
  return `
    <table class="exam-table exam-table-wide">
      <colgroup><col class="col-num-wide"><col class="col-cont-wide"></colgroup>
      <thead><tr>
        <th class="col-num-wide">No.</th>
        <th class="col-cont-wide">문장 / 단어 &amp; 답</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function makePageHTMLWide(slots, pageIndex, isAnswer) {
  const startNum  = pageIndex * 12 + 1;
  const academyHTML = `
    <div class="exam-header-center">
      <div class="hlabel">ACADEMY</div>
      <div class="hval">${academyName || ''}</div>
    </div>`;
  return `
  <div class="exam-page exam-page-wide" data-type="${isAnswer ? 'answer' : 'question'}">
    <div class="exam-header exam-header-wide">
      <div class="exam-header-left">${vocaTitle}</div>
      ${academyHTML}
      <div class="exam-header-right">
        <div class="hrow"><span class="hkey">범위</span><span>Day ${rangeStr}</span></div>
        <div class="hrow"><span class="hkey">이름</span><span>${studentName || ''}</span></div>
      </div>
    </div>
    <div class="exam-body-wide">
      ${makeTableHTMLWide(slots, startNum, isAnswer)}
    </div>
  </div>`;
}

function makePageHTML(slots, pageIndex, isAnswer) {
  const left  = slots.slice(0, 25);
  const right = slots.slice(25, 50);
  const startNum = pageIndex * 50 + 1;
  const labelText = isAnswer ? '답지' : '문제지';
  const pageLabel = pages.length > 1 ? ` ${pageIndex + 1}` : '';

  const academyHTML = `
    <div class="exam-header-center">
      <div class="hlabel">ACADEMY</div>
      <div class="hval">${academyName || ''}</div>
    </div>`;

  return `
  <div class="exam-page" data-type="${isAnswer ? 'answer' : 'question'}">
    <!-- [4] 레이블을 exam-page 안으로 이동해 인쇄 영역에 포함 -->
    
    <div class="exam-header">
      <div class="exam-header-left">${vocaTitle}</div>
      ${academyHTML}
      <div class="exam-header-right">
        <div class="hrow"><span class="hkey">범위</span><span>Day ${rangeStr}</span></div>
        <div class="hrow"><span class="hkey">이름</span><span>${studentName || ''}</span></div>
      </div>
    </div>
    <div class="exam-body">
      ${makeTableHTML(left,  startNum,      isAnswer)}
      ${makeTableHTML(right, startNum + 25, isAnswer)}
    </div>
  </div>`;
}

function render() {
  const preview = document.getElementById('preview');
  preview.innerHTML = '';

  // 문제지
  pages.forEach((slots, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrapper';
    wrap.dataset.role = 'question';
    wrap.style.position = 'relative';
    wrap.innerHTML = isWide()
      ? makePageHTMLWide(slots, pi, false)
      : makePageHTML(slots, pi, false);
    preview.appendChild(wrap);
  });

  // 답지
  pages.forEach((slots, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrapper';
    wrap.dataset.role = 'answer';
    wrap.style.position = 'relative';
    wrap.innerHTML = isWide()
      ? makePageHTMLWide(slots, pi, true)
      : makePageHTML(slots, pi, true);
    preview.appendChild(wrap);
  });
}

render();

// ── [1] 빈 페이지 버그 근본 수정 ──
// 핵심: 실제 출력될 마지막 exam-page에만 last-print-page 클래스 부여
// sheet-wrapper 단위가 아닌 exam-page 단위로 page-break 제어
function markLastPrintPage(mode) {
  // 모든 last-print-page 초기화
  document.querySelectorAll('.last-print-page').forEach(el => el.classList.remove('last-print-page'));

  let visiblePages;
  if (mode === 'question') {
    visiblePages = document.querySelectorAll('[data-role="question"] .exam-page');
  } else if (mode === 'answer') {
    visiblePages = document.querySelectorAll('[data-role="answer"] .exam-page');
  } else {
    // all: 답지의 마지막 페이지
    visiblePages = document.querySelectorAll('[data-role="answer"] .exam-page');
  }
  if (visiblePages.length > 0) {
    visiblePages[visiblePages.length - 1].classList.add('last-print-page');
  }
}

// [8] 인쇄
function doPrint(mode) {
  applyVisibility(mode);
  markLastPrintPage(mode);
  window.print();
  setTimeout(() => restoreVisibility(), 600);
}

// PDF 저장 — 커스텀 안내창 (브라우저 confirm 도메인 표시 우회)
function savePdf(mode) {
  const modeLabel = mode === 'all' ? '문제지 + 답지' : mode === 'question' ? '문제지' : '답지';

  // 커스텀 모달 표시
  document.getElementById('pdfGuideTarget').textContent = modeLabel;
  document.getElementById('pdfGuideModal').style.display = 'flex';
  document.getElementById('pdfGuideMode').dataset.mode = mode;
}

function closePdfGuide(confirmed) {
  const modal = document.getElementById('pdfGuideModal');
  const mode = document.getElementById('pdfGuideMode').dataset.mode;
  modal.style.display = 'none';
  if (!confirmed) return;
  applyVisibility(mode);
  markLastPrintPage(mode);
  setTimeout(() => {
    window.print();
    setTimeout(() => restoreVisibility(), 600);
  }, 200);
}

function applyVisibility(mode) {
  const qEls = document.querySelectorAll('[data-role="question"]');
  const aEls = document.querySelectorAll('[data-role="answer"]');
  if (mode === 'question') {
    qEls.forEach(el => el.classList.remove('no-print'));
    aEls.forEach(el => el.classList.add('no-print'));
  } else if (mode === 'answer') {
    qEls.forEach(el => el.classList.add('no-print'));
    aEls.forEach(el => el.classList.remove('no-print'));
  } else {
    qEls.forEach(el => el.classList.remove('no-print'));
    aEls.forEach(el => el.classList.remove('no-print'));

    // 문제지 페이지 수가 홀수면 문제지·답지 사이에 빈 페이지 삽입
    if (pages.length % 2 === 1) {
      const blank = document.createElement('div');
      blank.className = 'sheet-wrapper blank-spacer';
      blank.dataset.role = 'blank';
      blank.innerHTML = '<div class="exam-page" style="background:#fff;"></div>';
      const firstAnswer = document.querySelector('[data-role="answer"]');
      document.getElementById('preview').insertBefore(blank, firstAnswer);
    }
  }
}

function restoreVisibility() {
  document.querySelectorAll('[data-role]').forEach(el => el.classList.remove('no-print'));
  document.querySelectorAll('.last-print-page').forEach(el => el.classList.remove('last-print-page'));
  // 삽입했던 빈 페이지 제거
  document.querySelectorAll('.blank-spacer').forEach(el => el.remove());
}
</script>
