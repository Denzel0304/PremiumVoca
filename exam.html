<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 시험지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #1a1714;
  --paper: #f5f0e8;
  --accent: #8b2e2e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--paper);
  color: var(--ink);
}

/* ── 툴바 ── */
#toolbar {
  background: var(--ink);
  color: #fff;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 3px solid var(--accent);
  position: sticky;
  top: 0;
  z-index: 100;
}
.toolbar-title {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  margin-right: 8px;
}
.tbtn {
  padding: 8px 18px;
  border: 1px solid #555;
  background: transparent;
  color: #fff;
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.tbtn:hover { background: #333; }
.tbtn-primary { background: var(--accent); border-color: var(--accent); }
.tbtn-primary:hover { background: #6e2222; }
.tbtn-back { border-color: #888; color: #ccc; }
.sep { width: 1px; height: 24px; background: #444; flex-shrink: 0; }
.tb-spacer { flex: 1; }

/* ── 프리뷰 ── */
#preview {
  padding: 32px 24px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

/* ── 시험지 래퍼 (화면용) ── */
.sheet-wrapper {
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.13);
  border-radius: 2px;
  width: min(860px, 100%);
  position: relative;
  overflow: hidden;
}
.sheet-label {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 10px;
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 2px;
  font-weight: 700;
  letter-spacing: 0.1em;
  z-index: 10;
}

/* =============================================
   시험지 내부 — 화면 + 인쇄 공용
   ============================================= */
.exam-page {
  padding: 12mm 13mm 10mm 13mm;
  font-family: 'Noto Sans KR', sans-serif;
  /* 화면에서는 자연스러운 높이 */
  display: flex;
  flex-direction: column;
}

/* ── 헤더 ── */
.exam-header {
  display: flex;
  align-items: stretch;
  border: 2.5px solid #111;   /* ⑤ 굵은 테두리 */
  margin-bottom: 5px;
  flex-shrink: 0;
}
.exam-header-left {
  flex: 1;
  padding: 10px 14px;
  font-family: 'Noto Sans KR', sans-serif;   /* ④ 헤더 폰트 통일 */
  font-size: 18px;
  font-weight: 700;
  border-right: 2px solid #111;
  display: flex;
  align-items: center;
}
.exam-header-right {
  width: 200px;
  display: flex;
  flex-direction: column;
  font-size: 11px;
}
.exam-header-right .hrow {
  padding: 0 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid #ccc;
  flex: 1;
}
.exam-header-right .hrow:last-child { border-bottom: none; }
.exam-header-right .hkey {
  font-weight: 700;
  color: #555;
  min-width: 36px;
  font-size: 10px;
}

/* ── 2열 표 레이아웃 ── */
.exam-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 6px;
  flex: 1;               /* 남은 공간 채우기 */
}

/* ── 단어 표 ── */
.exam-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border: 2px solid #111;   /* ⑤ 표 바깥 굵은 테두리 */
  height: 100%;              /* ① 표가 항상 전체 높이 차지 */
}
.exam-table th, .exam-table td {
  border: 0.7px solid #999;
  font-size: 11.5px;
  padding: 0 5px;
  line-height: 1.35;
}
.exam-table th {
  background: #eeebe3;
  text-align: center;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 3px 5px;
  border-bottom: 1.5px solid #888;
}
.col-num  { width: 26px; text-align: center; }
.col-word { text-align: left; }
.col-ans  { text-align: left; width: 42%; }

.td-num {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: #111;
  font-family: 'DM Mono', monospace;
}
.td-word { font-size: 11.5px; word-break: break-all; }
.td-ans  { font-size: 11.5px; color: #111; word-break: keep-all; }
.td-ans.blank { } /* ⑦ 밑줄 없는 빈 칸 */

/* tbody가 table 높이를 채우도록 */
.exam-table tbody { height: 100%; }
.exam-table tbody tr { height: calc(100% / 25); }  /* 25행 균등 분배 */

/* =============================================
   인쇄 전용
   ============================================= */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; }
  #toolbar { display: none !important; }
  #preview { padding: 0 !important; gap: 0 !important; }

  .sheet-wrapper {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 100% !important;
    overflow: visible !important;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .sheet-wrapper:last-child { page-break-after: auto; }
  .sheet-label { display: none !important; }

  .exam-page {
    width: 210mm;
    height: 297mm;
    padding: 9mm 11mm 8mm 11mm;
    page-break-inside: avoid;
    overflow: hidden;
  }

  .exam-table {
    height: 100%;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .no-print { display: none !important; }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>
<body>

<div id="toolbar">
  <button class="tbtn tbtn-back" onclick="history.back()">← 돌아가기</button>
  <div class="sep"></div>
  <span class="toolbar-title" id="tbTitle"></span>
  <div class="sep"></div>
  <button class="tbtn tbtn-primary" onclick="doPrint()">🖨 인쇄</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="savePdf()">PDF 저장</button>
  <div class="tb-spacer"></div>
  <span id="tbInfo" style="font-size:11px;color:#aaa;"></span>
</div>

<div id="preview"></div>

<script>
// ── 캐시 무효화: 새 JSON 강제 로드 안내 ──
const raw = sessionStorage.getItem('examPayload');
if (!raw) {
  alert('출제 데이터가 없습니다. 처음부터 다시 시작해주세요.');
  location.href = 'index.html';
}
const P = JSON.parse(raw);
const { vocaTitle, studentName, rangeStr, questions, showPron, printAnswer, pdfOption } = P;

document.getElementById('tbTitle').textContent = vocaTitle;
document.getElementById('tbInfo').textContent =
  `출제 범위: Day ${rangeStr} · ${questions.length}문항 · ${printAnswer ? '답지 포함 인쇄' : '문제지만 인쇄'}`;

// ── 페이지 분할: 50개씩 나누기 ──
function splitPages(qs) {
  const pages = [];
  let i = 0;
  while (i < qs.length || pages.length === 0) {
    const chunk = qs.slice(i, i + 50);
    // 항상 50칸: 부족하면 null로 채움
    while (chunk.length < 50) chunk.push(null);
    pages.push(chunk);
    i += 50;
    if (i >= qs.length) break;
  }
  return pages;
}

const pages = splitPages(questions);

// ── 문제/답 텍스트 ──
// enKo: 영어(en) 표시 → 한글뜻(ko) 쓰기
// koEn: 한글뜻(ko) 표시 → 영어(en) 쓰기
function questionText(q) {
  if (!q) return '';
  return q.direction === 'enKo' ? q.en : q.ko;
}

function answerText(q) {
  if (!q) return '';
  if (q.direction === 'enKo') {
    // 영→한: 답 = 한글뜻  (발음 체크 시: 한글뜻[발음])
    return showPron ? `${q.ko}[${q.pron}]` : q.ko;
  } else {
    // 한→영: 답 = 영어단어 (발음 체크 시: 영어 / 한글뜻[발음])
    return showPron ? `${q.en} / ${q.ko}[${q.pron}]` : q.en;
  }
}

// ── 표 HTML ──
function makeTableHTML(half, startNum, isAnswer) {
  let rows = '';
  half.forEach((q, i) => {
    const num = startNum + i;
    const qText = q ? questionText(q) : '';
    const aText = q ? answerText(q) : '';

    const ansTd = isAnswer
      ? `<td class="td-ans">${aText}</td>`
      : `<td class="td-ans blank"></td>`;

    rows += `<tr>
      <td class="td-num">${num}</td>
      <td class="td-word">${qText}</td>
      ${ansTd}
    </tr>`;
  });

  return `
    <table class="exam-table">
      <colgroup>
        <col class="col-num">
        <col class="col-word">
        <col class="col-ans">
      </colgroup>
      <thead>
        <tr>
          <th class="col-num">No.</th>
          <th class="col-word">단어</th>
          <th class="col-ans">답</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── 시험지 1페이지 HTML ──
function makePageHTML(slots, pageIndex, isAnswer) {
  const left  = slots.slice(0, 25);
  const right = slots.slice(25, 50);
  const startNum = pageIndex * 50 + 1;

  const leftHTML  = makeTableHTML(left,  startNum,      isAnswer);
  const rightHTML = makeTableHTML(right, startNum + 25, isAnswer);

  // ② 이름란 밑줄 제거
  const nameRow = studentName
    ? `<div class="hrow"><span class="hkey">이름</span><span>${studentName}</span></div>`
    : `<div class="hrow"><span class="hkey">이름</span><span></span></div>`;

  return `
  <div class="exam-page" data-type="${isAnswer ? 'answer' : 'question'}">
    <div class="exam-header">
      <div class="exam-header-left">${vocaTitle}</div>
      <div class="exam-header-right">
        <div class="hrow"><span class="hkey">범위</span><span>Day ${rangeStr}</span></div>
        ${nameRow}
      </div>
    </div>
    <div class="exam-body">
      ${leftHTML}
      ${rightHTML}
    </div>
  </div>`;
}

// ── 렌더 ──
function render() {
  const preview = document.getElementById('preview');
  preview.innerHTML = '';

  // 문제지 페이지들
  pages.forEach((slots, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrapper';
    wrap.dataset.role = 'question';
    wrap.innerHTML = `<div class="sheet-label">문제지 ${pages.length > 1 ? (pi+1)+'p' : ''}</div>`
                   + makePageHTML(slots, pi, false);
    preview.appendChild(wrap);
  });

  // 답지 페이지들
  pages.forEach((slots, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrapper' + (!printAnswer ? ' no-print' : '');
    wrap.dataset.role = 'answer';
    wrap.id = pi === 0 ? 'answerSheetWrap' : '';
    wrap.innerHTML = `<div class="sheet-label">답지 ${pages.length > 1 ? (pi+1)+'p' : ''}</div>`
                   + makePageHTML(slots, pi, true);
    preview.appendChild(wrap);
  });
}

render();

// ── 인쇄 ──
function doPrint() {
  document.querySelectorAll('[data-role="answer"]').forEach(el => {
    if (printAnswer) el.classList.remove('no-print');
    else el.classList.add('no-print');
  });
  window.print();
}

// ── PDF 저장 ──
function savePdf() {
  const qEls = document.querySelectorAll('[data-role="question"]');
  const aEls = document.querySelectorAll('[data-role="answer"]');

  if (pdfOption === 1) {
    // 문제지만
    aEls.forEach(el => el.classList.add('no-print'));
    qEls.forEach(el => el.classList.remove('no-print'));
  } else if (pdfOption === 2) {
    // 답지만
    qEls.forEach(el => el.classList.add('no-print'));
    aEls.forEach(el => el.classList.remove('no-print'));
  } else {
    // 둘 다
    qEls.forEach(el => el.classList.remove('no-print'));
    aEls.forEach(el => el.classList.remove('no-print'));
  }

  setTimeout(() => {
    window.print();
    // 복원
    qEls.forEach(el => el.classList.remove('no-print'));
    aEls.forEach(el => {
      if (!printAnswer) el.classList.add('no-print');
      else el.classList.remove('no-print');
    });
  }, 200);
}
</script>
</body>
</html>
