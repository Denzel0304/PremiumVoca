<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>시험지 출력</title>
<style>
  body {
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background: #f3f4f6;
  }
  .toolbar {
    padding: 16px;
    background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar button {
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .toolbar button:hover {
    background: #f9fafb;
  }

  .page-container {
    padding: 20px 0 40px;
  }

  .sheet-wrapper {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    position: relative;
    page-break-after: auto;
    break-after: auto;
  }

  .sheet-wrapper.print-page-break {
    page-break-after: always;
    break-after: page;
  }

  .sheet-wrapper.print-page-last {
    page-break-after: auto !important;
    break-after: auto !important;
  }

  .sheet {
    padding: 16mm 14mm 14mm 14mm;
    box-sizing: border-box;
    min-height: 297mm;
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .sheet-title {
    font-size: 24px;
    font-weight: 700;
  }

  .sheet-sub {
    font-size: 13px;
    color: #4b5563;
    margin-top: 4px;
  }

  .sheet-page-label {
    font-size: 13px;
    color: #6b7280;
    white-space: nowrap;
  }

  table.exam-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 15px;
  }

  table.exam-table th,
  table.exam-table td {
    border: 1px solid #111827;
    padding: 8px 10px;
    text-align: center;
    vertical-align: middle;
    height: 38px;
    box-sizing: border-box;
  }

  table.exam-table th {
    background: #f9fafb;
    font-weight: 700;
  }

  td.word {
    text-align: left;
    padding-left: 12px;
  }

  td.blank {
    color: transparent;
  }

  .answer-grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 14px;
  }

  .answer-grid td,
  .answer-grid th {
    border: 1px solid #111827;
    padding: 7px 6px;
    text-align: center;
    vertical-align: middle;
    height: 34px;
    box-sizing: border-box;
  }

  .answer-grid th {
    background: #f9fafb;
    font-weight: 700;
  }

  .answer-grid td.answer-word {
    text-align: left;
    padding-left: 10px;
  }

  .answer-grid td.empty-cell {
    color: transparent;
  }

  .hidden-print-target {
    display: none !important;
  }

  @media print {
    body {
      background: white;
    }
    .toolbar {
      display: none !important;
    }
    .page-container {
      padding: 0;
    }
    .sheet-wrapper {
      margin: 0 auto;
      box-shadow: none;
      width: 210mm;
      min-height: auto;
    }
    .sheet {
      min-height: auto;
    }
    .hidden-print-target {
      display: none !important;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="printQuestions()">문제지만 인쇄</button>
    <button onclick="saveQuestions()">문제지만 저장</button>
    <button onclick="printAnswers()">답지만 인쇄</button>
    <button onclick="saveAnswers()">답지만 저장</button>
    <button onclick="printAllSheets()">전체 인쇄</button>
    <button onclick="saveAllSheets()">전체 저장</button>
  </div>

  <div class="page-container" id="pageContainer"></div>

<script>
const raw = sessionStorage.getItem('examData');
if (!raw) {
  alert('시험지 데이터가 없습니다.');
}
const examData = raw ? JSON.parse(raw) : {
  title: '시험지',
  subtitle: '',
  itemsPerPage: 50,
  answerItemsPerPage: 50,
  items: []
};

const pageContainer = document.getElementById('pageContainer');

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function chunkArray(arr, size) {
  const result = [];
  for (let i = 0; i < arr.length; i += size) {
    result.push(arr.slice(i, i + size));
  }
  return result;
}

function buildQuestionSheet(items, pageNum) {
  const itemsPerPage = Number(examData.itemsPerPage) || 50;
  const fixedItems = [...items];

  while (fixedItems.length < itemsPerPage) {
    fixedItems.push(null);
  }

  const rows = fixedItems.map((item, idx) => {
    const no = idx + 1 + (pageNum - 1) * itemsPerPage;

    if (!item) {
      return `
        <tr>
          <td>${no}</td>
          <td class="word blank">&nbsp;</td>
          <td class="blank">&nbsp;</td>
        </tr>
      `;
    }

    return `
      <tr>
        <td>${no}</td>
        <td class="word">${escapeHtml(item.word || '')}</td>
        <td>${escapeHtml(item.meaning || '')}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="sheet-wrapper question-sheet">
      <div class="sheet">
        <div class="sheet-header">
          <div>
            <div class="sheet-title">${escapeHtml(examData.title || '시험지')}</div>
            <div class="sheet-sub">${escapeHtml(examData.subtitle || '')}</div>
          </div>
          <div class="sheet-page-label">문제지 ${pageNum}</div>
        </div>

        <table class="exam-table">
          <thead>
            <tr>
              <th style="width: 10%;">번호</th>
              <th style="width: 45%;">단어</th>
              <th style="width: 45%;">뜻</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function buildAnswerSheet(items, pageNum) {
  const answerItemsPerPage = Number(examData.answerItemsPerPage) || 50;
  const fixedItems = [...items];

  while (fixedItems.length < answerItemsPerPage) {
    fixedItems.push(null);
  }

  const columnCount = 2;
  const rowsPerColumn = Math.ceil(answerItemsPerPage / columnCount);
  const columns = [];

  for (let c = 0; c < columnCount; c++) {
    columns.push(fixedItems.slice(c * rowsPerColumn, (c + 1) * rowsPerColumn));
  }

  const rows = [];
  for (let r = 0; r < rowsPerColumn; r++) {
    const left = columns[0][r] ?? null;
    const right = columns[1][r] ?? null;

    const leftNo = (pageNum - 1) * answerItemsPerPage + r + 1;
    const rightNo = (pageNum - 1) * answerItemsPerPage + rowsPerColumn + r + 1;

    rows.push(`
      <tr>
        ${renderAnswerCells(left, leftNo)}
        ${renderAnswerCells(right, rightNo)}
      </tr>
    `);
  }

  return `
    <div class="sheet-wrapper answer-sheet">
      <div class="sheet">
        <div class="sheet-header">
          <div>
            <div class="sheet-title">${escapeHtml(examData.title || '시험지')}</div>
            <div class="sheet-sub">${escapeHtml(examData.subtitle || '')}</div>
          </div>
          <div class="sheet-page-label">답지 ${pageNum}</div>
        </div>

        <table class="answer-grid">
          <thead>
            <tr>
              <th style="width: 8%;">번호</th>
              <th style="width: 42%;">정답</th>
              <th style="width: 8%;">번호</th>
              <th style="width: 42%;">정답</th>
            </tr>
          </thead>
          <tbody>
            ${rows.join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderAnswerCells(item, no) {
  if (!item) {
    return `
      <td>${no}</td>
      <td class="answer-word empty-cell">&nbsp;</td>
    `;
  }

  return `
    <td>${no}</td>
    <td class="answer-word">${escapeHtml(item.meaning || '')}</td>
  `;
}

function renderAll() {
  const items = Array.isArray(examData.items) ? examData.items : [];
  const questionPages = chunkArray(items, Number(examData.itemsPerPage) || 50);
  const answerPages = chunkArray(items, Number(examData.answerItemsPerPage) || 50);

  const questionHtml = questionPages.map((pageItems, idx) => buildQuestionSheet(pageItems, idx + 1)).join('');
  const answerHtml = answerPages.map((pageItems, idx) => buildAnswerSheet(pageItems, idx + 1)).join('');

  pageContainer.innerHTML = questionHtml + answerHtml;
}

function clearPrintState() {
  document.querySelectorAll('.sheet-wrapper').forEach(el => {
    el.classList.remove('hidden-print-target', 'print-page-break', 'print-page-last');
  });
}

function applyPrintMode(mode) {
  clearPrintState();

  let targets = [];
  const questionSheets = Array.from(document.querySelectorAll('.question-sheet'));
  const answerSheets = Array.from(document.querySelectorAll('.answer-sheet'));

  if (mode === 'questions') {
    answerSheets.forEach(el => el.classList.add('hidden-print-target'));
    targets = questionSheets;
  } else if (mode === 'answers') {
    questionSheets.forEach(el => el.classList.add('hidden-print-target'));
    targets = answerSheets;
  } else {
    targets = [...questionSheets, ...answerSheets];
  }

  targets.forEach((el, idx) => {
    if (idx === targets.length - 1) {
      el.classList.add('print-page-last');
    } else {
      el.classList.add('print-page-break');
    }
  });
}

function runPrint(mode) {
  applyPrintMode(mode);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
}

window.addEventListener('afterprint', () => {
  clearPrintState();
});

function printQuestions() {
  runPrint('questions');
}

function saveQuestions() {
  runPrint('questions');
}

function printAnswers() {
  runPrint('answers');
}

function saveAnswers() {
  runPrint('answers');
}

function printAllSheets() {
  runPrint('all');
}

function saveAllSheets() {
  runPrint('all');
}

renderAll();
</script>
</body>
</html>
