<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험지 미리보기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1714;
      --paper: #f5f0e8;
      --accent: #8b2e2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    #toolbar {
      background: var(--ink);
      color: #fff;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 3px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 700;
      margin-right: 4px;
    }

    .tbtn {
      padding: 8px 14px;
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tbtn:hover { background: #333; }
    .tbtn-primary { background: var(--accent); border-color: var(--accent); }
    .tbtn-primary:hover { background: #6e2222; }
    .tbtn-back { border-color: #888; color: #ccc; }

    .sep {
      width: 1px;
      height: 24px;
      background: #444;
      flex-shrink: 0;
    }

    .tb-spacer { flex: 1; }
    #tbInfo { font-size: 12px; color: #aaa; }

    #preview {
      padding: 32px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .sheet-wrapper {
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      border-radius: 2px;
      position: relative;
      width: min(794px, 100%);
    }

    .sheet-label {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 2px;
      font-weight: 700;
      letter-spacing: 0.1em;
      z-index: 10;
    }

    .exam-page {
      width: 794px;
      height: 1123px;
      padding: 36px 44px 32px 44px;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .exam-header {
      display: flex;
      align-items: stretch;
      border: 2.5px solid #111;
      margin-bottom: 5px;
      flex-shrink: 0;
      height: 58px;
    }

    .exam-header-left {
      flex: 1;
      padding: 0 14px;
      font-size: 17px;
      font-weight: 700;
      border-right: 1.5px solid #111;
      display: flex;
      align-items: center;
    }

    .exam-header-center {
      width: 180px;
      padding: 0 10px;
      font-size: 13px;
      border-right: 1.5px solid #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .exam-header-center .hlabel {
      font-size: 9px;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.06em;
    }

    .exam-header-center .hval {
      font-size: 13px;
      font-weight: 500;
    }

    .exam-header-right {
      width: 190px;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .exam-header-right .hrow {
      padding: 0 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #ccc;
      flex: 1;
    }

    .exam-header-right .hrow:last-child { border-bottom: none; }

    .exam-header-right .hkey {
      font-weight: 700;
      color: #555;
      min-width: 36px;
      font-size: 10px;
    }

    .exam-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 6px;
      flex: 1;
      min-height: 0;
    }

    .exam-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 2px solid #111;
      height: 100%;
    }

    .exam-table th,
    .exam-table td {
      border: 0.6px solid #999;
      font-size: 11px;
      padding: 0 5px;
      line-height: 1.3;
      overflow: hidden;
    }

    .exam-table th {
      background: #edeae2;
      text-align: center;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 3px 4px;
      border-bottom: 1.5px solid #888;
      height: 20px;
    }

    .col-num { width: 44px; }
    .col-word { width: 42%; }
    .col-ans { width: auto; }

    .td-num {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #111;
      font-family: 'DM Mono', monospace;
      white-space: nowrap;
    }

    .td-word {
      font-size: 11px;
      word-break: break-all;
    }

    .td-ans {
      font-size: 11px;
      color: #111;
    }

    .td-ans.blank { color: transparent; }
    tbody .exam-table tbody tr { height: calc((100% - 20px) / 25); }

    .no-print {
      display: none !important;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        background: #fff !important;
      }

      body {
        margin: 0;
      }

      #toolbar {
        display: none !important;
      }

      #preview {
        padding: 0 !important;
        gap: 0 !important;
      }

      .sheet-wrapper {
        box-shadow: none !important;
        border-radius: 0 !important;
        width: 210mm !important;
        margin: 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .sheet-wrapper.print-page-break {
        break-after: page;
        page-break-after: always;
      }

      .sheet-wrapper.print-page-last {
        break-after: auto;
        page-break-after: auto;
      }

      .sheet-label {
        display: block !important;
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 10px;
        background: var(--accent) !important;
        color: #fff !important;
        padding: 2px 8px;
        border-radius: 2px;
        font-weight: 700;
        letter-spacing: 0.1em;
        z-index: 10;
      }

      .exam-page {
        width: 210mm !important;
        height: 297mm !important;
        padding: 10mm 12mm 9mm 12mm !important;
        overflow: hidden;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .exam-table {
        height: 100%;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button class="tbtn tbtn-back" onclick="history.back()">← 돌아가기</button>
    <div class="sep"></div>
    <span class="toolbar-title" id="tbTitle"></span>
    <div class="sep"></div>

    <button class="tbtn tbtn-primary" onclick="doPrint('all')">🖨 모두 인쇄</button>
    <button class="tbtn" onclick="doPrint('question')">문제지 인쇄</button>
    <button class="tbtn" onclick="doPrint('answer')">답지 인쇄</button>

    <div class="sep"></div>

    <button class="tbtn" onclick="savePdf('all')">💾 모두 저장</button>
    <button class="tbtn" onclick="savePdf('question')">문제지 저장</button>
    <button class="tbtn" onclick="savePdf('answer')">답지 저장</button>

    <div class="tb-spacer"></div>
    <span id="tbInfo"></span>
  </div>

  <div id="preview"></div>

  <script>
    const raw = sessionStorage.getItem('examPayload');
    if (!raw) {
      alert('시험 데이터가 없습니다. 다시 생성해주세요.');
      location.href = 'index.html';
    }

    const P = JSON.parse(raw);
    const { vocaTitle, studentName, academyName, rangeStr, questions, enKoCount, koEnCount } = P;

    document.getElementById('tbTitle').textContent = vocaTitle || '';
    document.getElementById('tbInfo').textContent = `Day ${rangeStr || ''} · ${questions.length}문항 · 영한 ${enKoCount ?? 0} / 한영 ${koEnCount ?? 0}`;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function splitPages(qs) {
      const pages = [];
      for (let i = 0; i < qs.length; i += 50) {
        const chunk = qs.slice(i, i + 50);
        while (chunk.length < 50) chunk.push(null);
        pages.push(chunk);
      }
      return pages;
    }

    const pages = splitPages(questions || []);

    function questionText(q) {
      if (!q) return '';
      return q.direction === 'enKo' ? q.en : q.ko;
    }

    function answerText(q) {
      if (!q) return '';
      return q.direction === 'enKo' ? q.ko : q.en;
    }

    function makeTableHTML(half, startNum, isAnswer) {
      const rows = half.map((q, i) => {
        const num = startNum + i;
        const qText = q ? escapeHtml(questionText(q)) : '';
        const aText = q ? escapeHtml(answerText(q)) : '';
        const ansTd = isAnswer
          ? `<td class="td-ans">${aText}</td>`
          : `<td class="td-ans blank">&nbsp;</td>`;

        return `
          <tr>
            <td class="td-num">${q ? num : ''}</td>
            <td class="td-word">${qText}</td>
            ${ansTd}
          </tr>
        `;
      }).join('');

      return `
        <table class="exam-table">
          <colgroup>
            <col class="col-num" />
            <col class="col-word" />
            <col class="col-ans" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-num">No.</th>
              <th class="col-word">문제</th>
              <th class="col-ans">${isAnswer ? '정답' : ''}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function makePageHTML(slots, pageIndex, isAnswer) {
      const left = slots.slice(0, 25);
      const right = slots.slice(25, 50);
      const startNum = pageIndex * 50 + 1;
      const labelText = isAnswer ? 'ANSWER' : 'QUESTION';
      const pageLabel = pages.length > 1 ? ` ${pageIndex + 1}` : '';
      const academyHTML = academyName
        ? `
          <div class="exam-header-center">
            <div class="hlabel">ACADEMY</div>
            <div class="hval">${escapeHtml(academyName)}</div>
          </div>
        `
        : `
          <div class="exam-header-center">
            <div class="hlabel">ACADEMY</div>
            <div class="hval"></div>
          </div>
        `;

      return `
        <div class="exam-page" data-type="${isAnswer ? 'answer' : 'question'}">
          <div class="sheet-label" style="position:absolute;top:6px;right:10px;">${labelText}${pageLabel}</div>
          <div class="exam-header">
            <div class="exam-header-left">${escapeHtml(vocaTitle || '')}</div>
            ${academyHTML}
            <div class="exam-header-right">
              <div class="hrow"><span class="hkey">DAY</span><span>${escapeHtml(rangeStr || '')}</span></div>
              <div class="hrow"><span class="hkey">NAME</span><span>${escapeHtml(studentName || '')}</span></div>
            </div>
          </div>
          <div class="exam-body">
            ${makeTableHTML(left, startNum, isAnswer)}
            ${makeTableHTML(right, startNum + 25, isAnswer)}
          </div>
        </div>
      `;
    }

    function render() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';

      pages.forEach((slots, pi) => {
        const wrap = document.createElement('div');
        wrap.className = 'sheet-wrapper';
        wrap.dataset.role = 'question';
        wrap.style.position = 'relative';
        wrap.innerHTML = makePageHTML(slots, pi, false);
        preview.appendChild(wrap);
      });

      pages.forEach((slots, pi) => {
        const wrap = document.createElement('div');
        wrap.className = 'sheet-wrapper';
        wrap.dataset.role = 'answer';
        wrap.style.position = 'relative';
        wrap.innerHTML = makePageHTML(slots, pi, true);
        preview.appendChild(wrap);
      });
    }

    function getVisibleSheets(mode) {
      const allSheets = [...document.querySelectorAll('.sheet-wrapper')];
      if (mode === 'question') return allSheets.filter(el => el.dataset.role === 'question');
      if (mode === 'answer') return allSheets.filter(el => el.dataset.role === 'answer');
      return allSheets;
    }

    function applyVisibility(mode) {
      const allSheets = [...document.querySelectorAll('.sheet-wrapper')];
      const visibleSheets = getVisibleSheets(mode);

      allSheets.forEach(el => {
        el.classList.remove('print-page-break', 'print-page-last');
        if (visibleSheets.includes(el)) {
          el.classList.remove('no-print');
        } else {
          el.classList.add('no-print');
        }
      });

      visibleSheets.forEach((el, idx) => {
        if (idx === visibleSheets.length - 1) {
          el.classList.add('print-page-last');
        } else {
          el.classList.add('print-page-break');
        }
      });
    }

    function restoreVisibility() {
      document.querySelectorAll('.sheet-wrapper').forEach(el => {
        el.classList.remove('no-print', 'print-page-break', 'print-page-last');
      });
    }

    function afterPrintCleanup() {
      restoreVisibility();
      window.removeEventListener('afterprint', afterPrintCleanup);
    }

    function runPrint(mode) {
      applyVisibility(mode);
      window.addEventListener('afterprint', afterPrintCleanup, { once: true });
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.print();
        });
      });
    }

    function doPrint(mode) {
      runPrint(mode);
    }

    function savePdf(mode) {
      runPrint(mode);
    }

    render();
  </script>
</body>
</html>
