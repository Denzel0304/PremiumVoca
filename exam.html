<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 시험지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =============================================
   화면 UI (no-print)
   ============================================= */
:root {
  --ink: #1a1714;
  --paper: #f5f0e8;
  --paper2: #ede8dc;
  --accent: #8b2e2e;
  --line: #ccc4b0;
  --muted: #7a7060;
  --card: #faf7f2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--paper);
  color: var(--ink);
}

/* ── 상단 툴바 (화면전용) ── */
#toolbar {
  background: var(--ink);
  color: #fff;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 3px solid var(--accent);
  position: sticky;
  top: 0;
  z-index: 100;
}
#toolbar .toolbar-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 700;
  margin-right: 8px;
}
.tbtn {
  padding: 8px 18px;
  border: 1px solid #555;
  background: transparent;
  color: #fff;
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.03em;
}
.tbtn:hover { background: #333; }
.tbtn-primary {
  background: var(--accent);
  border-color: var(--accent);
}
.tbtn-primary:hover { background: #6e2222; }
.tbtn-back {
  border-color: #888;
  color: #ccc;
}
.sep { width: 1px; height: 24px; background: #444; flex-shrink:0; }
.tb-spacer { flex: 1; }

/* ── 프리뷰 영역 ── */
#preview {
  padding: 32px 24px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

/* ── 시험지 래퍼 ── */
.sheet-wrapper {
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.13);
  border-radius: 2px;
  overflow: hidden;
  /* A4 비율로 미리보기 */
  width: min(860px, 100%);
  position: relative;
}
.sheet-label {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 10px;
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 2px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

/* =============================================
   시험지 내부 (화면 + 인쇄 공용)
   ============================================= */
.exam-page {
  padding: 14mm 14mm 14mm 14mm;
  font-family: 'Noto Sans KR', sans-serif;
}

/* ── 헤더 ── */
.exam-header {
  display: flex;
  align-items: stretch;
  border: 1.5px solid #222;
  margin-bottom: 6px;
}
.exam-header-left {
  flex: 1;
  padding: 7px 12px;
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 700;
  border-right: 1px solid #222;
  display: flex;
  align-items: center;
}
.exam-header-right {
  width: 220px;
  display: flex;
  flex-direction: column;
  font-size: 11px;
}
.exam-header-right .hrow {
  padding: 4px 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid #ddd;
}
.exam-header-right .hrow:last-child { border-bottom: none; }
.exam-header-right .hkey {
  font-weight: 700;
  color: #555;
  min-width: 42px;
  font-size: 10px;
}

/* ── 2열 표 레이아웃 ── */
.exam-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 8px;
}

/* ── 단어 표 ── */
.exam-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.exam-table th, .exam-table td {
  border: 0.7px solid #aaa;
  font-size: 10.5px;
  padding: 2.5px 5px;
  line-height: 1.4;
}
.exam-table th {
  background: #f0ece4;
  text-align: center;
  font-weight: 700;
  font-size: 9.5px;
  letter-spacing: 0.05em;
  padding: 3px 5px;
}
.col-num  { width: 22px; text-align: center; }
.col-word { text-align: left; }
.col-ans  { text-align: left; min-width: 80px; }

.td-num { text-align: center; color: #888; font-size: 9.5px; font-family: 'DM Mono', monospace; }
.td-word { font-size: 10.5px; }
.td-ans  { font-size: 10.5px; color: #333; }
.td-ans.blank { color: transparent; } /* 문제지 답칸은 투명 = 빈칸처럼 보임 but 줄 유지 */
.td-ans.blank::after { content: ''; display: inline-block; width: 100%; border-bottom: 0.5px solid #bbb; }

/* 방향 표시 배지 */
.dir-badge {
  display: inline-block;
  font-size: 8px;
  padding: 0 3px;
  border-radius: 1px;
  margin-left: 3px;
  vertical-align: middle;
  font-weight: 700;
  color: #fff;
  background: #888;
  line-height: 1.5;
}
.dir-en { background: #4a6fa5; }
.dir-ko { background: #6a4a5e; }

/* 답지 제목 구분선 */
.answer-sheet-label {
  text-align: center;
  font-family: 'Noto Serif KR', serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  padding: 10px 0 4px;
  border-top: 2px solid var(--accent);
  margin-top: 8px;
  letter-spacing: 0.1em;
}

/* =============================================
   인쇄 전용 스타일
   ============================================= */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body { background: #fff !important; }

  #toolbar { display: none !important; }
  #preview { padding: 0; gap: 0; }
  .sheet-wrapper {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 100% !important;
    overflow: visible !important;
  }
  .sheet-label { display: none !important; }

  /* 각 시험지를 별도 페이지로 */
  .exam-page {
    width: 210mm;
    min-height: 297mm;
    max-height: 297mm;
    overflow: hidden;         /* 절대 넘치지 않도록 */
    padding: 10mm 12mm;
    page-break-after: always;
    page-break-inside: avoid;
    display: flex;
    flex-direction: column;
  }
  .exam-page:last-child { page-break-after: auto; }

  /* 표가 페이지 내에서 잘리지 않도록 */
  .exam-body {
    flex: 1;
  }
  .exam-table {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .exam-table tr {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* 인쇄 숨김 클래스 */
  .no-print-answer { display: none !important; }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>
<body>

<!-- 툴바 -->
<div id="toolbar">
  <button class="tbtn tbtn-back" onclick="history.back()">← 돌아가기</button>
  <div class="sep"></div>
  <span class="toolbar-title" id="tbTitle"></span>
  <div class="sep"></div>
  <button class="tbtn tbtn-primary" onclick="doPrint()">🖨 인쇄</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="savePdf()">PDF 저장</button>
  <div class="tb-spacer"></div>
  <span id="tbInfo" style="font-size:11px;color:#aaa;"></span>
</div>

<!-- 프리뷰 -->
<div id="preview"></div>

<script>
// ── 데이터 로드 ──
const raw = sessionStorage.getItem('examPayload');
if (!raw) { alert('출제 데이터가 없습니다. 처음부터 다시 시작해주세요.'); location.href = 'index.html'; }
const P = JSON.parse(raw);

const { vocaTitle, studentName, rangeStr, questions, showPron, printAnswer, pdfOption } = P;

// ── 툴바 정보 ──
document.getElementById('tbTitle').textContent = vocaTitle;
document.getElementById('tbInfo').textContent =
  `출제 범위: Day ${rangeStr} · ${questions.length}문항 · ${printAnswer ? '답지 포함 인쇄' : '문제지만 인쇄'}`;

// ── 50칸짜리 배열 만들기 ──
// 항상 50칸. 부족하면 null로 채움
function make50(qs) {
  const arr = [...qs];
  while (arr.length < 50) arr.push(null);
  return arr;
}

const slots = make50(questions); // 50개 (null 포함)
const left  = slots.slice(0, 25);
const right = slots.slice(25, 50);

// ── 단어 표시 텍스트 ──
function questionText(q) {
  if (!q) return '';
  return q.direction === 'enKo' ? q.en : q.ko;
}
function answerText(q, withPron) {
  if (!q) return '';
  if (q.direction === 'enKo') {
    return withPron ? `${q.ko}[${q.pron}]` : q.ko;
  } else {
    return withPron ? `${q.en} / ${q.ko}[${q.pron}]` : q.en;
  }
}
function dirBadge(q) {
  if (!q) return '';
  return q.direction === 'enKo'
    ? '<span class="dir-badge dir-en">영→한</span>'
    : '<span class="dir-badge dir-ko">한→영</span>';
}

// ── 시험지 HTML 생성 ──
function makeTableHTML(half, startNum, isAnswer) {
  let rows = '';
  half.forEach((q, i) => {
    const num = startNum + i;
    const qText = q ? questionText(q) : '';
    const aText = q ? answerText(q, showPron) : '';
    const badge = q ? dirBadge(q) : '';

    const ansTd = isAnswer
      ? `<td class="td-ans">${aText}</td>`
      : `<td class="td-ans blank">&nbsp;</td>`;

    rows += `<tr>
      <td class="td-num">${num}</td>
      <td class="td-word">${qText}${badge}</td>
      ${ansTd}
    </tr>`;
  });
  return `
    <table class="exam-table">
      <colgroup>
        <col class="col-num">
        <col class="col-word">
        <col class="col-ans">
      </colgroup>
      <thead>
        <tr>
          <th class="col-num">No.</th>
          <th class="col-word">단어</th>
          <th class="col-ans">답</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function makeExamPageHTML(isAnswer) {
  const label = isAnswer ? '답지' : '문제지';
  const leftHTML  = makeTableHTML(left,  1,  isAnswer);
  const rightHTML = makeTableHTML(right, 26, isAnswer);

  const nameRow = studentName
    ? `<div class="hrow"><span class="hkey">이름</span><span>${studentName}</span></div>`
    : `<div class="hrow"><span class="hkey">이름</span><span style="color:#bbb">___________</span></div>`;

  return `
  <div class="exam-page" data-type="${isAnswer ? 'answer' : 'question'}">
    <div class="exam-header">
      <div class="exam-header-left">${vocaTitle}</div>
      <div class="exam-header-right">
        <div class="hrow"><span class="hkey">범위</span><span>Day ${rangeStr}</span></div>
        ${nameRow}
        <div class="hrow"><span class="hkey">유형</span><span style="color:${isAnswer?'#8b2e2e':'#333'};font-weight:700;">${label}</span></div>
      </div>
    </div>
    <div class="exam-body">
      ${leftHTML}
      ${rightHTML}
    </div>
  </div>`;
}

// ── 프리뷰 렌더 ──
function render() {
  const preview = document.getElementById('preview');
  preview.innerHTML = '';

  // 문제지
  const qWrapper = document.createElement('div');
  qWrapper.className = 'sheet-wrapper';
  qWrapper.innerHTML = `<div class="sheet-label">문제지</div>` + makeExamPageHTML(false);
  preview.appendChild(qWrapper);

  // 답지
  const aWrapper = document.createElement('div');
  aWrapper.className = 'sheet-wrapper' + (!printAnswer ? ' no-print-answer' : '');
  aWrapper.id = 'answerSheetWrap';
  aWrapper.innerHTML = `<div class="sheet-label">답지</div>` + makeExamPageHTML(true);
  preview.appendChild(aWrapper);
}

render();

// ── 인쇄 ──
function doPrint() {
  // 인쇄 설정에 따라 답지 표시/숨김 제어
  const ansWrap = document.getElementById('answerSheetWrap');
  if (printAnswer) {
    ansWrap.classList.remove('no-print-answer');
  } else {
    ansWrap.classList.add('no-print-answer');
  }
  window.print();
}

// ── PDF 저장 ──
// html2pdf 라이브러리 사용
function savePdf() {
  alert('PDF 저장은 브라우저의 인쇄 → "PDF로 저장" 기능을 사용하세요.\n\n단계: 인쇄 버튼 클릭 → 프린터를 "PDF 저장"으로 선택 → 저장\n\n※ pdfOption=' + pdfOption + ' 설정에 맞게 답지 포함 여부가 자동으로 적용됩니다.');

  const ansWrap = document.getElementById('answerSheetWrap');
  // pdfOption: 1=문제지만, 2=답지만, 3=둘다
  if (pdfOption === 1) {
    // 문제지만: 답지 숨김
    ansWrap.classList.add('no-print-answer');
    // 문제지도 숨기고 답지만: 불가능하므로 별도 처리 필요 → 아래 pdfOption 2 참조
  } else if (pdfOption === 2) {
    // 답지만: 문제지 숨기고 답지만
    document.querySelectorAll('[data-type="question"]').forEach(el => el.style.display='none');
    ansWrap.classList.remove('no-print-answer');
  } else {
    // 둘다
    ansWrap.classList.remove('no-print-answer');
  }

  setTimeout(() => {
    window.print();
    // 복원
    document.querySelectorAll('[data-type="question"]').forEach(el => el.style.display='');
  }, 200);
}
</script>
</body>
</html>
